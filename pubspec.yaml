name: customer_app
description: QR Cafe — Customer Ordering App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP
  http: ^1.2.1

  # Local storage
  shared_preferences: ^2.5.5

  # QR Code Scanner
  mobile_scanner: ^5.2.3

  # Deep linking / Routing
  go_router: ^14.2.7

  # Payment
  razorpay_flutter: ^1.3.7

  # Image loading
  cached_network_image: ^3.3.1

  # Realtime updates
  socket_io_client: ^2.0.3+1

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local notifications (foreground)
  flutter_local_notifications: ^17.2.2

  # Icons
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^7.1.1
  fl_chart: ^1.2.0
  share_plus: ^13.1.0
  uuid: ^4.5.3
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
